<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balcony</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; color: #000; font-family: sans-serif; }

    #header {
      border-bottom: 2px solid #000;
      padding: 10px 16px;
      font-size: 1.4rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #header span { font-size: 1.4rem; flex: 1; text-align: center; }
    #header button {
      font-family: sans-serif;
      font-size: 0.85rem;
      border: 2px solid #000;
      background: #fff;
      padding: 4px 12px;
      cursor: pointer;
    }
    #header button:hover { background: #f0f0f0; }

    /* ── LOBBY ── */
    #lobby { padding: 24px; }
    #lobby h2 { font-size: 1rem; margin-bottom: 16px; }

    #rooms-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .room-card {
      border: 3px solid #000;
      width: 200px;
      cursor: pointer;
      text-decoration: none;
      color: #000;
      display: inline-block;
    }
    .room-card:hover { background: #f5f5f5; }
    .room-thumb {
      width: 200px;
      height: 120px;
      border-bottom: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #aaa;
      overflow: hidden;
      position: relative;
    }
    .room-thumb canvas { width: 100% !important; height: 100% !important; }
    .room-info { padding: 8px; }
    .room-info .room-name { font-weight: bold; font-size: 1rem; }
    .room-info .room-meta { font-size: 0.75rem; color: #555; margin-top: 2px; }

    /* new room card */
    #new-room-card {
      border: 3px dashed #aaa;
      width: 200px;
      height: 178px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #aaa;
      font-size: 0.9rem;
      gap: 8px;
    }
    #new-room-card:hover { border-color: #555; color: #555; }
    #new-room-card .plus { font-size: 2.5rem; line-height: 1; }

    /* ── ROOM VIEW ── */
    #room-view { display: none; height: calc(100vh - 47px); flex-direction: column; }

    #room-toolbar {
      border-bottom: 2px solid #000;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    #room-toolbar label { font-size: 0.8rem; }
    #room-toolbar input[type=color] { width: 32px; height: 28px; border: 1px solid #999; padding: 1px; cursor: pointer; }
    #room-toolbar input[type=range] { width: 80px; }
    #room-toolbar button {
      font-family: sans-serif;
      font-size: 0.8rem;
      border: 2px solid #000;
      background: #fff;
      padding: 3px 10px;
      cursor: pointer;
    }
    #room-toolbar button.active { background: #000; color: #fff; }
    #room-toolbar button:hover:not(.active) { background: #eee; }
    .tb-sep { width: 1px; background: #ccc; height: 24px; margin: 0 4px; }

    #room-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    #room-canvas-wrap canvas { display: block; }

    /* ── MODAL ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: #fff;
      border: 3px solid #000;
      padding: 24px;
      min-width: 280px;
    }
    #modal h2 { margin-bottom: 16px; }
    #modal input[type=text] {
      width: 100%;
      border: 2px solid #000;
      padding: 6px 8px;
      font-size: 1rem;
      font-family: sans-serif;
      margin-bottom: 14px;
    }
    #modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    #modal .modal-btns button {
      font-family: sans-serif;
      font-size: 0.9rem;
      border: 2px solid #000;
      background: #fff;
      padding: 5px 14px;
      cursor: pointer;
    }
    #modal .modal-btns button.primary { background: #000; color: #fff; }
  </style>
</head>
<body>

<div id="header">
  <button id="btn-back" style="display:none" onclick="showLobby()">← Back</button>
  <span id="header-title">Welcome to Balcony.</span>
  <button onclick="openNewRoomModal()">+ New Room</button>
</div>

<!-- LOBBY -->
<div id="lobby">
  <h2>Rooms</h2>
  <div id="rooms-grid">
    <!-- cards injected here -->
    <div id="new-room-card" onclick="openNewRoomModal()">
      <span class="plus">+</span>
      <span>New Room</span>
    </div>
  </div>
</div>

<!-- ROOM VIEW -->
<div id="room-view">
  <div id="room-toolbar">
    <label>Mode:</label>
    <button id="btn-select" class="active" onclick="setMode('select')">Select</button>
    <button id="btn-add"    onclick="setMode('add')">Add Block</button>
    <div class="tb-sep"></div>
    <label>Color: <input type="color" id="color-pick" value="#4a90d9"></label>
    <div class="tb-sep"></div>
    <label>W <input type="range" id="sz-w" min="0.5" max="10" step="0.1" value="2"></label>
    <label>H <input type="range" id="sz-h" min="0.5" max="10" step="0.1" value="2"></label>
    <label>D <input type="range" id="sz-d" min="0.5" max="10" step="0.1" value="2"></label>
    <div class="tb-sep"></div>
    <button onclick="deleteSelected()">Delete</button>
    <div class="tb-sep"></div>
    <button onclick="launchGame()" style="background:#000;color:#fff">▶ Play</button>
  </div>
  <div id="room-canvas-wrap"></div>
</div>

<!-- GAME IFRAME (fullscreen inside room-view) -->
<iframe id="game-frame" style="display:none;position:fixed;inset:0;width:100%;height:100%;border:none;z-index:50"></iframe>
<button id="game-close" onclick="closeGame()" style="display:none;position:fixed;top:10px;right:14px;z-index:60;font-family:sans-serif;font-size:0.9rem;border:2px solid #000;background:#fff;padding:4px 12px;cursor:pointer">✕ Exit</button>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h2>New Room</h2>
    <input type="text" id="room-name-input" placeholder="Room name..." maxlength="40">
    <div class="modal-btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="createRoom()">Create</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>
// ─────────────────────────────────────────────
//  DATA
// ─────────────────────────────────────────────
let rooms = [
  {
    id: 'balcony',
    name: 'Balcony',
    isGame: true,           // special: opens the embedded 3-D game
    meta: 'Built-in game',
  }
];

// ─────────────────────────────────────────────
//  LOBBY
// ─────────────────────────────────────────────
function renderLobby() {
  const grid = document.getElementById('rooms-grid');
  // clear existing cards (keep the + card at end)
  [...grid.querySelectorAll('.room-card')].forEach(c => c.remove());

  rooms.forEach(room => {
    const card = document.createElement('div');
    card.className = 'room-card';
    card.onclick = () => openRoom(room.id);
    card.innerHTML = `
      <div class="room-thumb" style="background:#e8f4ff;color:#888;font-size:0.8rem;">
        ${room.isGame ? '🎮 Game' : '🧱 Room'}
      </div>
      <div class="room-info">
        <div class="room-name">${room.name}</div>
        <div class="room-meta">${room.meta || 'Empty room'}</div>
      </div>`;
    grid.insertBefore(card, document.getElementById('new-room-card'));
  });
}

// ─────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────
function openNewRoomModal() {
  document.getElementById('room-name-input').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('room-name-input').focus(), 50);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('room-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') createRoom();
  if (e.key === 'Escape') closeModal();
});
function createRoom() {
  const name = document.getElementById('room-name-input').value.trim();
  if (!name) return;
  const id = 'room_' + Date.now();
  rooms.push({ id, name, blocks: [], meta: '0 blocks' });
  closeModal();
  renderLobby();
  openRoom(id);
}

// ─────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────
function showLobby() {
  disposeEditor();
  document.getElementById('lobby').style.display = '';
  document.getElementById('room-view').style.display = 'none';
  document.getElementById('btn-back').style.display = 'none';
  document.getElementById('header-title').textContent = 'Welcome to Balcony.';
  renderLobby();
}

function openRoom(id) {
  const room = rooms.find(r => r.id === id);
  if (!room) return;

  document.getElementById('header-title').textContent = room.name;
  document.getElementById('btn-back').style.display = '';
  document.getElementById('lobby').style.display = 'none';

  if (room.isGame) {
    launchBuiltinGame();
    return;
  }

  document.getElementById('room-view').style.display = 'flex';
  currentRoom = room;
  initEditor(room);
}

// ─────────────────────────────────────────────
//  BUILT-IN GAME LAUNCHER
// ─────────────────────────────────────────────
function launchBuiltinGame() {
  document.getElementById('room-view').style.display = 'flex';
  document.getElementById('room-toolbar').style.display = 'none';
  initGameInCanvas();
}
function closeGame() {
  document.getElementById('game-frame').style.display = 'none';
  document.getElementById('game-close').style.display = 'none';
}
function launchGame() {
  // export current room blocks as a play-mode (simple: just hide toolbar)
  document.getElementById('room-toolbar').style.display = 'none';
}

// ─────────────────────────────────────────────
//  3-D EDITOR
// ─────────────────────────────────────────────
let editorScene, editorCamera, editorRenderer, editorOrbit, transformCtrl;
let editorBlocks = [];   // { mesh, data }
let selectedMesh = null;
let editorMode = 'select';
let currentRoom = null;
let editorAF = null;

function initEditor(room) {
  disposeEditor();

  const wrap = document.getElementById('room-canvas-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  editorScene = new THREE.Scene();
  editorScene.background = new THREE.Color(0x87ceeb);
  editorScene.fog = new THREE.Fog(0x87ceeb, 40, 120);

  editorCamera = new THREE.PerspectiveCamera(60, W / H, 0.1, 300);
  editorCamera.position.set(0, 10, 22);
  editorCamera.lookAt(0, 0, 0);

  editorRenderer = new THREE.WebGLRenderer({ antialias: true });
  editorRenderer.setSize(W, H);
  editorRenderer.shadowMap.enabled = true;
  wrap.appendChild(editorRenderer.domElement);

  editorOrbit = new THREE.OrbitControls(editorCamera, editorRenderer.domElement);
  editorOrbit.enableDamping = true;
  editorOrbit.dampingFactor = 0.08;
  editorOrbit.maxPolarAngle = Math.PI / 2 - 0.01;

  transformCtrl = new THREE.TransformControls(editorCamera, editorRenderer.domElement);
  transformCtrl.addEventListener('dragging-changed', e => {
    editorOrbit.enabled = !e.value;
  });
  editorScene.add(transformCtrl);

  // Lights
  editorScene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const sun = new THREE.DirectionalLight(0xfffbe0, 1.0);
  sun.position.set(10, 20, 10);
  sun.castShadow = true;
  editorScene.add(sun);

  // Ground grid
  const gridHelper = new THREE.GridHelper(40, 40, 0x888888, 0xcccccc);
  gridHelper.position.y = 0.01;
  editorScene.add(gridHelper);

  // Ground plane (invisible, for raycasting)
  const groundGeo = new THREE.PlaneGeometry(40, 40);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x7ec850 });
  const groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  groundMesh.userData.isGround = true;
  editorScene.add(groundMesh);

  // Load existing blocks
  (room.blocks || []).forEach(b => addBlockFromData(b));

  // Click to select / place
  editorRenderer.domElement.addEventListener('pointerdown', onEditorClick);

  // Resize
  window.addEventListener('resize', onEditorResize);

  // Animate
  function loop() {
    editorAF = requestAnimationFrame(loop);
    editorOrbit.update();
    editorRenderer.render(editorScene, editorCamera);
  }
  loop();
}

function onEditorResize() {
  const wrap = document.getElementById('room-canvas-wrap');
  if (!editorRenderer) return;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  editorCamera.aspect = W / H;
  editorCamera.updateProjectionMatrix();
  editorRenderer.setSize(W, H);
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onEditorClick(e) {
  if (e.button !== 0) return;
  const wrap = document.getElementById('room-canvas-wrap');
  const rect = editorRenderer.domElement.getBoundingClientRect();
  mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, editorCamera);

  if (editorMode === 'add') {
    // Cast against ground
    const meshes = editorBlocks.map(b => b.mesh);
    const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(groundPlane, pt);
    if (pt) {
      const w = parseFloat(document.getElementById('sz-w').value);
      const h = parseFloat(document.getElementById('sz-h').value);
      const d = parseFloat(document.getElementById('sz-d').value);
      const color = document.getElementById('color-pick').value;
      const data = {
        x: Math.round(pt.x * 2) / 2,
        y: h / 2,
        z: Math.round(pt.z * 2) / 2,
        w, h, d, color
      };
      addBlockFromData(data);
      saveRoom();
    }
    return;
  }

  // Select mode
  const hits = raycaster.intersectObjects(editorBlocks.map(b => b.mesh));
  if (hits.length > 0) {
    selectMesh(hits[0].object);
  } else {
    deselectMesh();
  }
}

function addBlockFromData(data) {
  const geo = new THREE.BoxGeometry(data.w, data.h, data.d);
  const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(data.color) });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(data.x, data.y, data.z);
  editorScene.add(mesh);
  editorBlocks.push({ mesh, data: { ...data } });
  return mesh;
}

function selectMesh(mesh) {
  deselectMesh();
  selectedMesh = mesh;
  // highlight
  mesh.material.emissive = new THREE.Color(0x333333);
  transformCtrl.attach(mesh);

  // Sync UI to this block's data
  const entry = editorBlocks.find(b => b.mesh === mesh);
  if (entry) {
    document.getElementById('color-pick').value = entry.data.color;
    document.getElementById('sz-w').value = entry.data.w;
    document.getElementById('sz-h').value = entry.data.h;
    document.getElementById('sz-d').value = entry.data.d;
  }
}

function deselectMesh() {
  if (selectedMesh) {
    selectedMesh.material.emissive = new THREE.Color(0x000000);
    transformCtrl.detach();
    selectedMesh = null;
  }
}

function deleteSelected() {
  if (!selectedMesh) return;
  editorScene.remove(selectedMesh);
  editorBlocks = editorBlocks.filter(b => b.mesh !== selectedMesh);
  transformCtrl.detach();
  selectedMesh = null;
  saveRoom();
}

function setMode(m) {
  editorMode = m;
  document.getElementById('btn-select').classList.toggle('active', m === 'select');
  document.getElementById('btn-add').classList.toggle('active', m === 'add');
  if (m === 'add') deselectMesh();
}

// Apply color/size changes to selected block live
document.getElementById('color-pick').addEventListener('input', () => {
  if (!selectedMesh) return;
  selectedMesh.material.color.set(document.getElementById('color-pick').value);
  const entry = editorBlocks.find(b => b.mesh === selectedMesh);
  if (entry) { entry.data.color = document.getElementById('color-pick').value; saveRoom(); }
});

['sz-w','sz-h','sz-d'].forEach(id => {
  document.getElementById(id).addEventListener('input', resizeSelected);
});

function resizeSelected() {
  if (!selectedMesh) return;
  const w = parseFloat(document.getElementById('sz-w').value);
  const h = parseFloat(document.getElementById('sz-h').value);
  const d = parseFloat(document.getElementById('sz-d').value);
  // Rebuild geometry
  selectedMesh.geometry.dispose();
  selectedMesh.geometry = new THREE.BoxGeometry(w, h, d);
  const entry = editorBlocks.find(b => b.mesh === selectedMesh);
  if (entry) { entry.data.w = w; entry.data.h = h; entry.data.d = d; saveRoom(); }
}

function saveRoom() {
  if (!currentRoom) return;
  currentRoom.blocks = editorBlocks.map(b => ({
    x: b.mesh.position.x,
    y: b.mesh.position.y,
    z: b.mesh.position.z,
    w: b.data.w, h: b.data.h, d: b.data.d,
    color: b.data.color,
  }));
  currentRoom.meta = `${currentRoom.blocks.length} block${currentRoom.blocks.length !== 1 ? 's' : ''}`;
}

function disposeEditor() {
  if (editorAF) cancelAnimationFrame(editorAF);
  if (editorRenderer) {
    editorRenderer.domElement.removeEventListener('pointerdown', onEditorClick);
    editorRenderer.dispose();
    editorRenderer.domElement.remove();
    editorRenderer = null;
  }
  window.removeEventListener('resize', onEditorResize);
  editorBlocks = [];
  selectedMesh = null;
  document.getElementById('room-toolbar').style.display = '';
}

// ─────────────────────────────────────────────
//  BUILT-IN GAME (the Balcony 3D game, inline)
// ─────────────────────────────────────────────
let gameAF = null;
function initGameInCanvas() {
  disposeEditor();
  const wrap = document.getElementById('room-canvas-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  const gs = new THREE.Scene();
  gs.background = new THREE.Color(0x87ceeb);
  gs.fog = new THREE.Fog(0x87ceeb, 30, 80);

  const gc = new THREE.PerspectiveCamera(60, W/H, 0.1, 200);
  gc.position.set(0, 8, 18);
  gc.lookAt(0, 0, 0);

  const gr = new THREE.WebGLRenderer({ antialias: true });
  gr.setSize(W, H);
  gr.shadowMap.enabled = true;
  wrap.appendChild(gr.domElement);

  gs.add(new THREE.AmbientLight(0xffffff, 0.7));
  const sun = new THREE.DirectionalLight(0xfffbe0, 1);
  sun.position.set(10, 20, 10);
  sun.castShadow = true;
  gs.add(sun);

  function bx(w,h,d,col) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color:col}));
    m.castShadow = true; m.receiveShadow = true; return m;
  }

  const gnd = bx(24,0.6,24,0x7ec850); gnd.position.y=-0.3; gs.add(gnd);
  const trunk = bx(1.2,3.5,1.2,0xe07830); trunk.position.set(-4,1.75,0); gs.add(trunk);
  const leaves = bx(4.2,2.2,4.2,0x5ab832); leaves.position.set(-4,4.4,0); gs.add(leaves);

  const player = new THREE.Group();
  const head = bx(0.9,0.9,0.9,0xf5c78e); head.position.y=2.35; player.add(head);
  const torso = bx(1.0,1.1,0.6,0x4a90d9); torso.position.y=1.4; player.add(torso);
  const legL = bx(0.42,1.1,0.5,0x2c5f8a); legL.position.set(-0.28,0.3,0); player.add(legL);
  const legR = bx(0.42,1.1,0.5,0x2c5f8a); legR.position.set(0.28,0.3,0); player.add(legR);
  player.position.set(2,0.6,1); gs.add(player);

  const keys = {};
  const kd = e => keys[e.key]=true;
  const ku = e => keys[e.key]=false;
  window.addEventListener('keydown',kd);
  window.addEventListener('keyup',ku);

  const orbit = new THREE.OrbitControls(gc, gr.domElement);
  orbit.enableDamping=true; orbit.dampingFactor=0.08;
  orbit.maxPolarAngle = Math.PI/2-0.02;

  const SPEED=4, HALF=11.7;
  const clock2 = new THREE.Clock();

  function resizeGame() {
    gc.aspect = wrap.clientWidth / wrap.clientHeight;
    gc.updateProjectionMatrix();
    gr.setSize(wrap.clientWidth, wrap.clientHeight);
  }
  window.addEventListener('resize', resizeGame);

  function gameLoop() {
    gameAF = requestAnimationFrame(gameLoop);
    const dt = Math.min(clock2.getDelta(), 0.05);
    let dx=0,dz=0;
    if(keys['ArrowUp']   ||keys['w']||keys['W']) dz-=1;
    if(keys['ArrowDown'] ||keys['s']||keys['S']) dz+=1;
    if(keys['ArrowLeft'] ||keys['a']||keys['A']) dx-=1;
    if(keys['ArrowRight']||keys['d']||keys['D']) dx+=1;
    const moving = dx||dz;
    if(moving){
      const len=Math.sqrt(dx*dx+dz*dz); dx/=len; dz/=len;
      player.position.x = Math.max(-HALF,Math.min(HALF, player.position.x+dx*SPEED*dt));
      player.position.z = Math.max(-HALF,Math.min(HALF, player.position.z+dz*SPEED*dt));
      player.rotation.y = Math.atan2(dx,dz);
      orbit.target.x += (player.position.x-orbit.target.x)*0.05;
      orbit.target.z += (player.position.z-orbit.target.z)*0.05;
      orbit.target.y = 1;
    }
    const t=clock2.getElapsedTime();
    if(moving){ legL.rotation.x=Math.sin(t*8)*0.5; legR.rotation.x=-Math.sin(t*8)*0.5; }
    else { legL.rotation.x*=0.8; legR.rotation.x*=0.8; }
    orbit.update();
    gr.render(gs,gc);
  }
  gameLoop();

  // cleanup when leaving
  const origDispose = disposeEditor.bind(this);
  window._gameCleanup = () => {
    cancelAnimationFrame(gameAF);
    window.removeEventListener('keydown',kd);
    window.removeEventListener('keyup',ku);
    window.removeEventListener('resize',resizeGame);
    gr.dispose();
    gr.domElement.remove();
  };
}

// Override showLobby to also kill game
const _origShowLobby = showLobby;
window.showLobby = function() {
  if(window._gameCleanup) { window._gameCleanup(); window._gameCleanup=null; }
  disposeEditor();
  document.getElementById('lobby').style.display='';
  document.getElementById('room-view').style.display='none';
  document.getElementById('btn-back').style.display='none';
  document.getElementById('header-title').textContent='Welcome to Balcony.';
  document.getElementById('room-toolbar').style.display='';
  renderLobby();
};

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
renderLobby();
</script>
</body>
</html>
