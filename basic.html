<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balcony</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #000;
      font-family: sans-serif;
    }

    #header {
      border-bottom: 2px solid #000;
      padding: 10px 16px;
      font-size: 1.4rem;
      text-align: center;
    }

    #content {
      padding: 24px;
    }

    #play-box {
      display: inline-block;
      cursor: pointer;
      text-decoration: none;
      color: #000;
    }

    #icon {
      width: 200px;
      height: 120px;
      border: 3px solid #000;
      background: #fff;
    }

    #play-label {
      display: block;
      text-align: center;
      font-size: 1.3rem;
      margin-top: 6px;
    }

    h1 {
      margin-top: 20px;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>
  <div id="header">
    Welcome to basic test.
  </div>

  <div id="content">
    <a id="play-box" href="https://agam1233.github.io/basic/game.html">
      <div id="icon"></div>
      <span id="play-label">PLAY</span>
    </a>

    <h1>
      Currently, playing doesn't do anything yet.<br>
      Go to: https://agam1233.github.io/basic/game.html
    </h1>
  </div>
</body>
</html>
